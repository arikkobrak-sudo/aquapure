<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1e38" />
      <stop offset="100%" stop-color="#050a14" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="80%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="glassGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer ambient glow -->
  <circle cx="256" cy="300" r="160" fill="#38bdf8" opacity="0.18" filter="url(#glow)" />

  <!-- Water Drop Path -->
  <path d="M256,70 C256,70 120,230 120,330 C120,410 180,450 256,450 C332,450 392,410 392,330 C392,230 256,70 256,70 Z"
        fill="url(#dropGrad)" filter="url(#glow)" />

  <!-- Inner Water Highlight -->
  <path d="M256,105 C256,105 145,245 145,335 C145,400 195,432 256,432 C230,432 170,390 170,335 C170,255 256,105 256,105 Z"
        fill="url(#glassGloss)" opacity="0.6" />

  <!-- Cute Companion Face inside the drop -->
  <circle cx="210" cy="320" r="9" fill="#082f49" />
  <circle cx="302" cy="320" r="9" fill="#082f49" />
  <!-- Sparkles in eyes -->
  <circle cx="207" cy="317" r="3.5" fill="#ffffff" />
  <circle cx="299" cy="317" r="3.5" fill="#ffffff" />
  <!-- Cute smile -->
  <path d="M236,340 Q256,356 276,340" fill="none" stroke="#082f49" stroke-width="4.5" stroke-linecap="round" />
  <!-- Blush -->
  <ellipse cx="190" cy="336" rx="9" ry="6" fill="#f43f5e" opacity="0.45" />
  <ellipse cx="322" cy="336" rx="9" ry="6" fill="#f43f5e" opacity="0.45" />

  <!-- Top Glass Sheen -->
  <ellipse cx="230" cy="180" rx="28" ry="48" transform="rotate(-25 230 180)" fill="#ffffff" opacity="0.4" />
</svg>